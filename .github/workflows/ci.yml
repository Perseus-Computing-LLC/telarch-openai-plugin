name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # kibisis declares its SQLCipher module (sqlcipher3) as a dependency, so the encrypted vault that the
      # local server creates by default needs no extra package here.
      - name: Install the test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest kibisis==0.1.0a17 harpe==0.1.0a13 argus-ledger==0.1.0a9
      - name: Run the tests
        run: python -m pytest -q tests
